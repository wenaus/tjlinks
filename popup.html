<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <textarea id="title" placeholder="Title" rows="1"></textarea>
  <textarea id="url" placeholder="URL" rows="1"></textarea>
  <textarea id="text" placeholder="Tags, notes..." rows="1"></textarea>
  <button id="copy">Copy</button>
  <button id="copy-clean">Copy without suffix</button>
  <button id="save-tjai">Save to tjai</button>
  <button id="save-tjai-clean">Save to tjai without suffix</button>
  <button id="save-readme">Add to tjai ReadMe</button>
  <button id="save-readme-clean">Add to tjai ReadMe without suffix</button>
  <div id="indico-section" style="display:none;">
    <div id="indico-info"></div>
    <button id="add-calendar">Add to tjai calendar</button>
  </div>
  <div id="api-key-section" style="display:none;">
    <input id="api-key" type="password" placeholder="tjai API key">
    <button id="save-key">Save key</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
