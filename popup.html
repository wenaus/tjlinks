<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <textarea id="title" placeholder="Title" rows="1"></textarea>
  <textarea id="url" placeholder="URL" rows="1"></textarea>
  <textarea id="text" placeholder="Tags, notes..." rows="1"></textarea>
  <div class="capture-options">
    <label><input id="pin" type="checkbox"> pin</label>
    <label><input id="top" type="checkbox"> top</label>
  </div>
  <div class="button-pair">
    <button id="copy">Copy</button>
    <button id="copy-clean" class="without-suffix">without suffix</button>
  </div>
  <div class="button-pair">
    <button id="save-tjai">Save to tjai</button>
    <button id="save-tjai-clean" class="without-suffix">without suffix</button>
  </div>
  <div class="button-pair">
    <button id="save-readme">Add to tjai ReadMe</button>
    <button id="save-readme-clean" class="without-suffix">without suffix</button>
  </div>
  <button id="curate-picks">Curate picks from page</button>
  <button id="curate-picks-dl">Curate picks + download slides</button>
  <div id="event-section" style="display:none;">
    <div id="event-info"></div>
    <button id="add-calendar">Add to tjai calendar</button>
  </div>
  <div id="api-key-section" style="display:none;">
    <input id="api-key" type="password" placeholder="tjai API key">
    <button id="save-key">Save key</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
